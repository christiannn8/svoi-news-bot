name: tg-diag
on: workflow_dispatch
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: getMe с разных серверов GitHub
        shell: bash
        env:
          T: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "IP: $(curl -s -m 20 https://api.ipify.org)"
          curl -s -m 40 -w ' [%{http_code} %{time_total}s]' "https://api.telegram.org/bot$(echo -n "$T" | tr -d '[:space:]')/getMe"; echo
