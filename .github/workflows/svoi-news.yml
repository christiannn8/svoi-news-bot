name: svoi-news
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Не отправлять в Telegram, только показать пост"
        default: "1"
      force_url:
        description: "Опубликовать именно эту статью (ссылка), даже если сегодня уже был пост"
        default: ""
      ai_json:
        description: "JSON с пунктами summary, meaning, attention (пишет Claude)"
        default: ""
      list_only:
        description: "1 = только показать кандидатов, ничего не публиковать"
        default: "0"
      delete_message_id:
        description: "Номер сообщения в ветке, которое удалить перед публикацией"
        default: ""
permissions:
  contents: write
concurrency: svoi-news
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q test_bot.py
      - name: Пропуск, если сейчас не 10:00 в Афинах (двойной cron из-за DST)
        id: gate
        run: |
          H=$(TZ=Europe/Athens date +%H)
          echo "athens_hour=$H"
          # GitHub иногда запускает расписание с опозданием: окно 10:00-13:59, второй пост за день бот всё равно не сделает
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$H" -lt 10 ] || [ "$H" -gt 13 ]; }; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - name: Бот
        if: steps.gate.outputs.skip != '1'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          AI_JSON: ${{ inputs.ai_json }}
          LIST_ONLY: ${{ inputs.list_only }}
          FORCE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_url || '' }}
          DELETE_MESSAGE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.delete_message_id || '' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
        run: python bot.py
      - name: Сохранить posted.json
        if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "svoi-news-bot"; git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "posted: обновление списка опубликованного" && git push)
